<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Power Platform system context</title>
<desc id="desc">Users and makers access Power Platform workload products, which rely on shared platform capabilities and integrate with enterprise systems under a governance and lifecycle control plane.</desc>
<style>
text{font-family:Arial,sans-serif;fill:#111827} .h{font-size:28px;font-weight:700}.t{font-size:20px}.s{font-size:17px}.box{fill:#fff;stroke:#374151;stroke-width:2}.group{fill:#f8fafc;stroke:#64748b;stroke-width:2}.arrow{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker></defs>
<rect x="30" y="30" width="1140" height="660" rx="18" class="group"/>
<text x="60" y="70" class="h">Power Platform enterprise context</text>
<rect x="70" y="120" width="220" height="110" rx="12" class="box"/><text x="180" y="160" text-anchor="middle" class="t">Users / Makers</text><text x="180" y="193" text-anchor="middle" class="s">Architects, developers, operators</text>
<rect x="390" y="105" width="420" height="150" rx="12" class="box"/><text x="600" y="140" text-anchor="middle" class="t">Workload products</text><text x="600" y="175" text-anchor="middle" class="s">Power Apps · Power Automate · Power BI</text><text x="600" y="205" text-anchor="middle" class="s">Power Pages · Copilot Studio</text>
<rect x="390" y="315" width="420" height="150" rx="12" class="box"/><text x="600" y="350" text-anchor="middle" class="t">Shared platform capabilities</text><text x="600" y="385" text-anchor="middle" class="s">Dataverse · Connectors · Power Fx · AI</text><text x="600" y="415" text-anchor="middle" class="s">Environments · Gateways · Admin · ALM</text>
<rect x="900" y="270" width="220" height="190" rx="12" class="box"/><text x="1010" y="310" text-anchor="middle" class="t">Enterprise systems</text><text x="1010" y="345" text-anchor="middle" class="s">Azure</text><text x="1010" y="375" text-anchor="middle" class="s">Microsoft 365 / Fabric</text><text x="1010" y="405" text-anchor="middle" class="s">SaaS / On-premises</text>
<rect x="200" y="535" width="800" height="95" rx="12" class="box"/><text x="600" y="570" text-anchor="middle" class="t">Enterprise control plane</text><text x="600" y="603" text-anchor="middle" class="s">Entra ID · Governance · Data policies · Security · Monitoring · Deployment</text>
