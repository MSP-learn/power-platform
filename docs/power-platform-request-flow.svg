<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Typical Power Platform request and integration flow</title>
<desc id="desc">A user authenticates with Microsoft Entra ID, invokes a Power Platform workload in an environment, and the workload accesses Dataverse or calls an external system through a connector or enterprise API while governance and monitoring span the transaction.</desc>
<style>text{font-family:Arial,sans-serif;fill:#111827}.h{font-size:28px;font-weight:700}.t{font-size:19px}.s{font-size:16px}.box{fill:#fff;stroke:#374151;stroke-width:2}.arrow{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#a)}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;fill:none}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#374151"/></marker></defs>
<text x="45" y="50" class="h">Typical request and integration flow</text>
<rect x="45" y="140" width="160" height="90" rx="12" class="box"/><text x="125" y="190" text-anchor="middle" class="t">User</text>
<rect x="275" y="140" width="185" height="90" rx="12" class="box"/><text x="368" y="180" text-anchor="middle" class="t">Microsoft Entra ID</text><text x="368" y="208" text-anchor="middle" class="s">Authentication</text>
<rect x="530" y="125" width="220" height="120" rx="12" class="box"/><text x="640" y="170" text-anchor="middle" class="t">Power Platform workload</text><text x="640" y="205" text-anchor="middle" class="s">Assigned environment</text>
<rect x="840" y="70" width="250" height="100" rx="12" class="box"/><text x="965" y="110" text-anchor="middle" class="t">Dataverse</text><text x="965" y="140" text-anchor="middle" class="s">Data + platform security</text>
<rect x="840" y="230" width="250" height="120" rx="12" class="box"/><text x="965" y="270" text-anchor="middle" class="t">Connector / API</text><text x="965" y="300" text-anchor="middle" class="s">Remote dependency boundary</text>
<rect x="840" y="430" width="250" height="100" rx="12" class="box"/><text x="965" y="470" text-anchor="middle" class="t">External system</text><text x="965" y="500" text-anchor="middle" class="s">Own auth / limits / availability</text>
<path d="M205 185 H275" class="arrow"/><path d="M460 185 H530" class="arrow"/><path d="M750 165 H840" class="arrow"/><path d="M750 205 L840 270" class="arrow"/><path d="M965 350 V430" class="arrow"/>
<rect x="250" y="410" width="430" height="100" rx="12" class="box"/><text x="465" y="450" text-anchor="middle" class="t">Governance and operations</text><text x="465" y="480" text-anchor="middle" class="s">Data policy · Monitoring · Audit · Ownership</text>
<path d="M465 410 V250" class="dash"/><path d="M680 460 H820" class="dash"/>
</svg>