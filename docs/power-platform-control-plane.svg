<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Power Platform enterprise control plane</title>
<desc id="desc">A Microsoft Entra tenant contains governed Power Platform environments. Central controls apply policy, security, lifecycle, and monitoring while workload teams own business solutions within assigned environments.</desc>
<style>text{font-family:Arial,sans-serif;fill:#111827}.h{font-size:28px;font-weight:700}.t{font-size:20px}.s{font-size:17px}.box{fill:#fff;stroke:#374151;stroke-width:2}.group{fill:#f8fafc;stroke:#64748b;stroke-width:2}.arrow{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#374151"/></marker></defs>
<text x="50" y="50" class="h">Enterprise environment and control-plane architecture</text>
<rect x="50" y="85" width="1100" height="675" rx="16" class="group"/><text x="80" y="120" class="t">Microsoft Entra tenant</text>
<rect x="90" y="155" width="1020" height="120" rx="12" class="box"/><text x="600" y="190" text-anchor="middle" class="t">Central platform control plane</text><text x="600" y="230" text-anchor="middle" class="s">Environment lifecycle · Data policies · Security standards · ALM · Monitoring · Capacity</text>
<rect x="100" y="335" width="280" height="250" rx="12" class="box"/><text x="240" y="375" text-anchor="middle" class="t">Development</text><text x="240" y="420" text-anchor="middle" class="s">Active authoring</text><text x="240" y="455" text-anchor="middle" class="s">Solution development</text><text x="240" y="490" text-anchor="middle" class="s">Developer / shared dev</text>
<rect x="460" y="335" width="280" height="250" rx="12" class="box"/><text x="600" y="375" text-anchor="middle" class="t">Test / UAT</text><text x="600" y="420" text-anchor="middle" class="s">Deployment-only changes</text><text x="600" y="455" text-anchor="middle" class="s">Validation / acceptance</text><text x="600" y="490" text-anchor="middle" class="s">Production-like policy</text>
<rect x="820" y="335" width="280" height="250" rx="12" class="box"/><text x="960" y="375" text-anchor="middle" class="t">Production</text><text x="960" y="420" text-anchor="middle" class="s">Controlled deployments</text><text x="960" y="455" text-anchor="middle" class="s">Operational ownership</text><text x="960" y="490" text-anchor="middle" class="s">Monitoring / support</text>
<path d="M240 275 V335" class="arrow"/><path d="M600 275 V335" class="arrow"/><path d="M960 275 V335" class="arrow"/><path d="M380 460 H460" class="arrow"/><path d="M740 460 H820" class="arrow"/>
<rect x="250" y="640" width="700" height="80" rx="12" class="box"/><text x="600" y="675" text-anchor="middle" class="s">Workload ownership is delegated; platform policy and lifecycle controls remain centralized.</text>
</svg>